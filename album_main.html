        id: "000", tag: "PROLOGUE", date: "'26.07.03", title: "000 - Prologue",
        text: `あの時出会えたことは運命なんだろうなと思ってます。\n初めて出会ったあの日から私の日常は変わりました。心動かされる毎日です。\n\nみなみさんがこれからも笑っていけますように。みなみさんがゆなといて幸せだって思ってもらえますように。みなみさんがずっとずっと元気で生きていけますように。\n私はいつだってみなみさんの幸せを願っています。だから、みなみさんはみなみさんらしくこれからも自分の目標に向かって、やりたいことに全力で取り組んでください。そんな姿に惚れたので、私に揺らされているような姿は見たくないです。\n\n不器用な私だから全然上手に気持ち伝えられないし、不安にさせちゃうこともあるかもしれないけど、私はみなみさんのことしか見てないし、みなみさんが大好きです。\nどんなことがあっても味方です。みなみさんの笑顔が見たいので、これからも幸せにします。\n\n一緒に幸せになろうね。これからもたくさん思い出増やしていこうね。\n\n愛しています。`,

      {

        text: `告白成功してお付き合いが始まった日。\n\n町田駅で待ち合わせしてたけど、緊張しすぎて帰りたかったなぁ。心臓出てくるかと思ったもんね。もんじゃ行って、カラオケ行って、まだ付き合ってもないのにキスしちゃって…なぜかその唇に触れたくなったんだよね。受け入れてくれてありがとう。初キスは忘れもしません。\n\nみなみさんの最寄り駅に着いてから、公園まで歩いていよいよ告白。\n用意していた花束と手紙を渡して無事お付き合いが始まったね。マグカップもありがとう。可愛すぎてずっと机に飾ってます。\n\n隣を歩くだけで照れくさいのに、みなみさんが無意識にぐいぐい寄ってくるから私の歩く道がどんどん狭まっていくのも本当に愛らしかった。いい加減にして？\n\n付き合ってくれてありがとう。初心忘るべからず`,

        text: `前日に急遽会うことが決まって、馬場でお寿司を食べた日\nゲーセンへ行って、太鼓の達人にマリカー、モグラ叩き。ゲーセンでこんなに夢中になってはしゃいで最高の時間を過ごせるのも、みなみさんとだからこそだな〜っと感謝の気持ちでいっぱいでした。\n\nそのままみなみさんの家にお泊りして、翌朝はキスマをつけるかつけさせないかの真剣勝負。じゃれ合っていたら、出かけるギリギリの時間になっちゃうのも愛おしいです。\n\n会ったら会った分だけ、次に会えない日が寂しくなっちゃうけれど、一緒に過ごす時間も離れている時間も、全部ふたりを成長させてくれているんだなって感じています。\n\n「会えない時間や距離に僕らは試されている」\nこの歌詞みたいに、会えない時間でさえお互いを成長できるような関係になりたいと思ってるよ。\n\nやっぱり私には、みなみさんじゃなきゃダメです。`,

        text: `ふたりで九十九里浜までドライブに行った日\n到着してすぐに海へ飛び込んで、二人してずぶ濡れになりながら泳んだり、海辺をお散歩したり、砂浜にお絵描きしたり…なんだか「青春だなぁ」って笑い合えて、本当に楽しかったです。\n\nお昼に食べたハンバーグもすごく美味しかったな。素敵な場所を見つけてくれてありがとう。計画性ないのにどのお店行ってもあたりだよね。愛の力ってやつ？\n\n夜は韓国料理を食べに行って、そこでもずーっと二人でゲーム。夢中になってゲームのことを語っているみなみさんの姿が、可愛くて愛おしかったよ。\n\nみなみさんと過ごす時間はいつも一瞬で過ぎちゃって、どこへ行っても時間が足りなく感じてしまう。\nこれから先も、もっといろんな景色を二人で見に行こうね。`,
        backText: "今度はBBQでもしたいね", image: "images/page16.png"

      {
        id: "017", tag: "MEMORY 17", date: "2026.08.21 - 08.25", title: "017 - 5日間のお泊り",
        text: `気づいたらなんと5日間も一緒に過ごしていてびっくり。\n前半の2日は私の家で, 後半の3日はみなみさんの家で。あんなにずっと一緒にいられたなんて、自分でもびっくりしちゃうくらい嬉しかったな。早く一緒に住みたいなって、ますます思いが強くなりました。\n\nみなみさんの家でお洗濯をしたりお料理を作ったり、家事をしているだけで心から幸せだったのに、大好きな人の帰りをワクワクしながら待つ時間は、さらに愛おしい時間です。\n\nこっそり練習したピアノも、まだまだ下手くそなのに優しく褒めてくれてありがとう。\nギターも頑張るから、いつか絶対に二人でデュエットしようね。\n\n本当に幸せな5日間をありがとう。`,
        backText: "おそろいの柔軟剤で私を思い出させる作戦", image: "images/page17.png"

        text: `二人で初めてのディズニーシー \n幸せな時間をありがとう。\n\n一緒に乗ったアトラクションが全部楽しすぎたなぁ。ファンスプもレイジングも上下運動のやつもすべてが最高すぎたよ。カレーもおいしかったしポップコーンも二人で6個食べたしアイスも食べたし。ん？食べ過ぎ？こんなに食べといて帰りにお腹すいたとかいうみなみさんが恐ろしいわ笑\n\n最後にタワテラとトイマニ乗ったけど二人とも叫びすぎてのどやられたね。タワテラで叫ぶのはわかるけど、トイマニで叫ぶって何？いい加減にして？\n\n最後に地球儀の前で膝抱えるやつしたくてやってたけど、まさかできると思わなかった。写真撮るだけなのにこんなに楽しくてこんなに幸せなのはみなみさんとだからなんだろうな。どの写真も宝物です。\n\nまだまだこれからも楽しい思い出増やしていこうね。心から愛しています。`,

    window.secretLetterText = `みなみさんへ\n\n付き合ってから今日まで、みなみさんと過ごしたすべての時間が私の宝物です。\n\n照れくさくて普段は直接言えないけれど、みなみさんの笑顔も、真っ直ぐなところも、甘えてくるところも、少し変なところも、一緒にいて楽しいところも、ダンス頑張っているところも全部全部愛おしいよ。みなみさんが私のことを思ってくれてるように、私もみなみさんのことを心から毎日思っています。\n\nこれからもずっとみなみさんの隣にいられますように。笑っていられますように。\n何があっても私たちが手をつないでいれば大丈夫。\nどんなことだって乗り越えていける。\nだから安心して好きなことをやり続けていこうね。\n\nこれからもまたぶつかったりしんどい時期が来るかもしれないけど、どんな時でも相手を思いやる気持ちだけは忘れないでいようね。みなみさんも一人で抱え込まずに私になんでも言ってね。私も日々いろんな思いをみなみさんに伝えていこうと思います。\n\nこれからも自分たちのペースで少しずつお互いのこと知っていこう。\n一生かけてみなみさんのことを知り尽くしていきます。\n\nみなみさんとの出会いに感謝です。\n大好きだよ。\n\n結南より`;
