<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MEMORIAL ARCHIVE</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0d0b0a;
      --gold-primary: #d4af37;
      --gold-glow: #f3e5ab;
      --text-muted: #8c8275;
      --font-en: 'Cormorant Garamond', Georgia, serif;
      --font-ja: 'Shippori Mincho', "游明朝", "Yu Mincho", serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0; padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: #f5f0eb;
      font-family: var(--font-ja);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* 背景粒子 */
    #bg-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
      opacity: 0.4;
    }

    .maintenance-card {
      position: relative;
      z-index: 10;
      background: rgba(22, 18, 15, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 16px;
      padding: 40px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(212, 175, 55, 0.15);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .brand {
      font-family: var(--font-en);
      font-size: 0.75rem;
      letter-spacing: 0.35em;
      color: var(--gold-primary);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .icon-lock {
      font-size: 2.2rem;
      margin-bottom: 16px;
      display: inline-block;
      filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.5));
    }

    h1 {
      font-family: var(--font-en);
      font-size: 1.8rem;
      letter-spacing: 0.1em;
      font-weight: 500;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .sub-title {
      font-size: 0.85rem;
      color: var(--gold-glow);
      margin-bottom: 24px;
      letter-spacing: 0.08em;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: var(--gold-primary);
      margin: 0 auto 24px auto;
      opacity: 0.5;
    }

    .message {
      font-size: 0.9rem;
      line-height: 1.9;
      color: #d1c7bc;
      margin-bottom: 28px;
      white-space: pre-wrap;
    }

    .pass-input-wrapper {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 10px;
    }

    input[type="password"] {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 20px;
      padding: 8px 16px;
      color: #ffffff;
      font-size: 0.9rem;
      text-align: center;
      width: 150px;
      outline: none;
    }

    .unlock-btn {
      background: linear-gradient(135deg, #2b231d, #42352b);
      border: 1px solid var(--gold-primary);
      color: var(--gold-glow);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      letter-spacing: 0.1em;
    }

    .error-msg {
      font-size: 0.78rem;
      color: #e74c3c;
      min-height: 1.2em;
    }

    .footer-text {
      margin-top: 30px;
      font-family: var(--font-en);
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.2em;
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <main class="maintenance-card">
    <div class="brand">MEMORIAL ARCHIVE</div>
    <div class="icon-lock">🔒</div>
    <h1>Private Archive</h1>
    <p class="sub-title">〜 ただいま非公開・準備中です 〜</p>
    
    <div class="divider"></div>

    <p class="message">このウェブサイトは現在アクセスを制限しております。
コンテンツの調整中のため、しばらくお待ちください。</p>

    <!-- 🔑 管理用ロック解除フォーム -->
    <div class="pass-container">
      <div class="pass-input-wrapper">
        <input type="password" id="adminPass" placeholder="Passcode" maxlength="8">
        <button class="unlock-btn" id="unlockSiteBtn">閲覧</button>
      </div>
      <div class="error-msg" id="errorMsg"></div>
    </div>

    <div class="footer-text">MINAMI & YUNA</div>
  </main>

  <script>
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    for (let i = 0; i < 30; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 1.5 + 0.5,
        speedY: -(Math.random() * 0.2 + 0.05),
        opacity: Math.random() * 0.5 + 0.1
      });
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.y += p.speedY;
        if (p.y < 0) p.y = canvas.height;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(212, 175, 55, ${p.opacity})`;
        ctx.fill();
      });
      requestAnimationFrame(animate);
    }
    animate();

    // 🔑 閲覧用パスワード（0703）で本編 album_main.html へ移動
    const unlockSiteBtn = document.getElementById('unlockSiteBtn');
    const adminPass = document.getElementById('adminPass');
    const errorMsg = document.getElementById('errorMsg');

    if (unlockSiteBtn) {
      unlockSiteBtn.addEventListener('click', () => {
        if (adminPass.value === '5098') {
          window.location.href = 'album_main.html';
        } else {
          errorMsg.textContent = 'パスワードが違います';
        }
      });
    }
  </script>
</body>
</html>
