<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CINEMA FILM — Minami & Yuna's Story</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=9999999">
  
  <style>
    /* 🎬 2段交差ループ・シネマフィルム専用スタイル */
    body {
      background-color: #060504 !important;
      color: #f5f0eb !important;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .cinema-header {
      text-align: center;
      padding: 25px 15px 10px 15px;
      z-index: 10;
    }

    .cinema-header .brand {
      font-family: var(--font-en);
      font-size: 0.7rem;
      letter-spacing: 0.35em;
      color: var(--gold-primary);
      text-transform: uppercase;
    }

    .cinema-header h1 {
      font-family: var(--font-en);
      font-size: 1.8rem;
      letter-spacing: 0.12em;
      font-weight: 600;
      color: #ffffff;
      margin-top: 4px;
    }

    .back-to-album-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--gold-primary);
      color: var(--gold-glow) !important;
      border-radius: 20px;
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      transition: all 0.3s ease;
    }

    /* 🎞️ 2段フィルム構造 */
    .film-viewport-double {
      width: 100vw;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      gap: 30px;
      overflow: hidden;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      perspective: 1000px;
    }

    .film-viewport-double:active {
      cursor: grabbing;
    }

    .film-track {
      display: flex;
      gap: 20px;
      width: max-content;
      will-change: transform;
    }

    /* フィルムフレーム */
    .film-frame {
      width: 200px;
      height: 250px;
      background: #14100d;
      border: 1.5px solid rgba(212, 175, 55, 0.4);
      border-radius: 12px;
      padding: 10px;
      position: relative;
      flex-shrink: 0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .film-frame.is-center {
      border-color: var(--gold-glow);
      transform: scale(1.08) translateZ(20px);
      box-shadow: 0 15px 35px rgba(212, 175, 55, 0.3), 0 0 20px rgba(243, 229, 171, 0.4);
    }

    .film-frame img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 6px;
      display: block;
      pointer-events: none;
    }

    .frame-stamp {
      position: absolute;
      bottom: 12px;
      right: 14px;
      font-family: var(--font-en);
      font-size: 0.75rem;
      color: var(--gold-glow);
      font-weight: 600;
    }

    .frame-title {
      font-size: 0.85rem;
      color: #ffffff;
      margin-top: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }

    /* モーダルポップアップ */
    .photo-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(5, 4, 3, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 10000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .photo-modal.show {
      display: flex;
    }

    .pop-card-inner {
      width: 90vw;
      max-width: 380px;
      height: 480px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .pop-card-inner.is-flipped {
      transform: rotateY(180deg);
    }

    .pop-card-front, .pop-card-back {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 16px;
      padding: 20px;
      background: #fdfbf7;
      color: #1a1a1a;
      border: 1.5px solid var(--gold-primary);
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .pop-card-front img {
      width: 100%;
      height: 290px;
      object-fit: cover;
      border-radius: 10px;
    }

    .pop-card-back {
      transform: rotateY(180deg);
      background: linear-gradient(135deg, #fefcf9, #f4ede2);
      text-align: left;
    }

    .pop-card-back h3 {
      font-size: 1.2rem;
      border-bottom: 1.5px dashed var(--gold-primary);
      padding-bottom: 8px;
      color: #2b231d;
    }

    .pop-card-back p {
      font-size: 0.92rem;
      line-height: 1.85;
      color: #3d352e;
      white-space: pre-wrap;
      overflow-y: auto;
      flex: 1;
      margin-top: 12px;
    }

    .modal-close-btn {
      position: absolute;
      top: 10px; right: 15px;
      font-size: 1.8rem;
      cursor: pointer;
      color: #1a1a1a;
      z-index: 5;
    }

    .cinema-footer-guide {
      text-align: center;
      padding: 15px;
      font-size: 0.75rem;
      color: var(--gold-glow);
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header class="cinema-header">
    <div class="brand">CINEMATIC ARCHIVE</div>
    <h1>Minami & Yuna's Film</h1>
    <a href="index.html" class="back-to-album-btn">📖 MEMORIAL ALBUM へ戻る</a>
  </header>

  <!-- 🎞️ 2段自動交差 ＆ スワイプ連動 フィルムビューポート -->
  <main class="film-viewport-double">
    <div class="film-track" id="filmTrackTop"></div>
    <div class="film-track" id="filmTrackBottom"></div>
  </main>

  <div class="cinema-footer-guide">
    👆 左右スワイプで手動早送り / 写真タップで字幕お手紙が反転
  </div>

  <!-- タップ時のポップアップカード（反転対応） -->
  <div class="photo-modal" id="photoModal">
    <div class="pop-card-inner" id="popCardInner">
      <!-- 表面 -->
      <div class="pop-card-front">
        <span class="modal-close-btn" id="modalCloseFront">&times;</span>
        <img id="modalImg" src="" alt="拡大写真">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
          <h3 id="modalTitle" style="font-size:1.1rem;"></h3>
          <span id="modalStamp" style="font-family:var(--font-en); font-size:0.85rem; color:var(--gold-dark); font-weight:600;"></span>
        </div>
        <button id="flipToBackBtn" style="margin-top:8px; padding:6px; background:var(--text-dark); color:#fff; border:1px solid var(--gold-primary); border-radius:20px; font-size:0.75rem; cursor:pointer;">🔄 字幕メッセージを読む</button>
      </div>
      <!-- 裏面（長文コメント） -->
      <div class="pop-card-back">
        <span class="modal-close-btn" id="modalCloseBack">&times;</span>
        <h3 id="modalBackTitle"></h3>
        <p id="modalDesc"></p>
        <button id="flipToFrontBtn" style="margin-top:8px; padding:6px; background:var(--text-dark); color:#fff; border:1px solid var(--gold-primary); border-radius:20px; font-size:0.75rem; cursor:pointer; align-self:center; width:100%;">🔄 写真に戻る</button>
      </div>
    </div>
  </div>

  <script src="cinema.js?v=9999999"></script>
</body>
</html>
