<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Minami & Yuna — Cinema Film Flow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    @charset "UTF-8";

    :root {
      --cinema-bg: #0a0807;
      --gold-primary: #d4af37;
      --gold-glow: #f3e5ab;
      --font-en: 'Cormorant Garamond', Georgia, serif;
      --font-ja: 'Shippori Mincho', "游明朝", serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0; padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--cinema-bg);
      color: #ffffff;
      font-family: var(--font-ja);
      overflow: hidden;
      position: fixed;
    }

    .cinema-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, #231c15 0%, #080605 100%);
      z-index: 0;
    }

    /* ヘッダー */
    .cinema-header {
      position: fixed;
      top: 15px; left: 0; width: 100%;
      text-align: center;
      z-index: 10;
      pointer-events: none;
      padding: 0 15px;
    }

    .cinema-header .brand {
      font-family: var(--font-en);
      font-size: 0.65rem;
      letter-spacing: 0.35em;
      color: var(--gold-primary);
      text-transform: uppercase;
    }

    .cinema-header h1 {
      font-family: var(--font-en);
      font-size: 1.5rem;
      letter-spacing: 0.12em;
      font-weight: 600;
      margin-top: 1px;
      color: #ffffff;
    }

    .cinema-header .sub {
      font-size: 0.7rem;
      color: #a89f91;
      letter-spacing: 0.1em;
    }

    /* 🎞️ 画面全体に広がる2段フィルムビューポート */
    .film-viewport-double {
      position: fixed;
      top: 52%; left: 0;
      width: 100vw;
      height: 380px;
      transform: translateY(-50%);
      z-index: 5;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .film-track-row {
      position: relative;
      width: 100%;
      height: 175px;
      overflow: hidden;
    }

    .film-track {
      display: flex;
      gap: 12px;
      padding: 12px 10px;
      background: #12100e;
      border-top: 6px repeating-linear-gradient(90deg, #000 0px, #000 8px, #d4af37 8px, #d4af37 15px);
      border-bottom: 6px repeating-linear-gradient(90deg, #000 0px, #000 8px, #d4af37 8px, #d4af37 15px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9), 0 0 20px rgba(212, 175, 55, 0.2);
      position: absolute;
      left: 0;
      white-space: nowrap;
      will-change: transform;
    }

    /* 写真コマ */
    .film-frame {
      flex: none;
      width: 110px;
      height: 140px;
      background: #ffffff;
      padding: 4px 4px 16px 4px;
      border-radius: 3px;
      position: relative;
      box-shadow: 0 5px 15px rgba(0,0,0,0.6);
      cursor: pointer;
      filter: brightness(0.9);
    }

    .film-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 2px;
      display: block;
      pointer-events: none;
    }

    .film-frame .frame-stamp {
      position: absolute;
      bottom: 2px; right: 4px;
      font-family: var(--font-en);
      font-size: 0.58rem;
      color: #8c6a2d;
      font-weight: 600;
      pointer-events: none;
    }

    /* ガイド表示 */
    .cinema-guide {
      position: fixed;
      bottom: 20px; left: 0; width: 100%;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }

    .cinema-guide p {
      font-size: 0.72rem;
      color: var(--gold-glow);
      background: rgba(20, 16, 12, 0.85);
      display: inline-block;
      padding: 6px 16px;
      border-radius: 25px;
      border: 1px solid rgba(212, 175, 55, 0.4);
    }

    /* 💥 モーダル ＆ 裏返し */
    .photo-pop-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(5, 4, 3, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
      perspective: 1200px;
    }

    .photo-pop-modal.show {
      display: flex;
    }

    .pop-card-inner {
      width: 88vw;
      max-width: 340px;
      height: 380px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .pop-card-inner.is-flipped {
      transform: rotateY(180deg);
    }

    .pop-card-front-face,
    .pop-card-back-face {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.9), 0 0 35px rgba(212, 175, 55, 0.5);
      border: 1.5px solid var(--gold-primary);
      background: #fdfbf7;
      color: var(--cinema-bg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .pop-card-front-face .card-img-wrap {
      position: relative;
      width: 100%;
      height: 210px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.3);
    }

    .pop-card-front-face img {
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .pop-timestamp {
      position: absolute;
      bottom: 8px; right: 10px;
      font-family: var(--font-en);
      font-size: 0.8rem;
      color: var(--gold-glow);
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }

    .pop-card-front-face .pop-card-info h3 {
      font-size: 1.05rem;
      color: #1a1a1a;
      margin-top: 8px;
      font-weight: 600;
    }

    .flip-hint-text {
      font-size: 0.72rem;
      color: var(--gold-dark);
      text-align: center;
      margin-top: 4px;
      font-weight: 600;
    }

    .pop-card-back-face {
      transform: rotateY(180deg);
      background: linear-gradient(135deg, #fefcf9, #f4ede2);
      text-align: center;
      justify-content: center;
      gap: 12px;
    }

    .pop-card-back-face h3 {
      font-size: 1.1rem;
      color: #1a1a1a;
      border-bottom: 1px dashed rgba(212, 175, 55, 0.5);
      padding-bottom: 6px;
    }

    .pop-card-back-face p {
      font-size: 0.88rem;
      line-height: 1.8;
      color: #4a423a;
      white-space: pre-wrap;
      text-align: left;
      max-height: 220px;
      overflow-y: auto;
    }

    .pop-btn-group {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .pop-btn {
      flex: 1;
      background: #1a1a1a;
      color: #ffffff;
      border: 1px solid var(--gold-primary);
      padding: 9px 12px;
      border-radius: 20px;
      font-family: var(--font-en);
      font-size: 0.78rem;
      cursor: pointer;
    }

    .pop-btn.flip-btn {
      background: linear-gradient(135deg, #3d3128, #1c1815);
      border-color: var(--gold-glow);
    }
  </style>
</head>
<body>

  <!-- 背景シネマキャンバス -->
  <div class="cinema-bg"></div>

  <!-- タイトルヘッダー -->
  <header class="cinema-header">
    <div class="brand">CINEMATIC ARCHIVE</div>
    <h1>Minami & Yuna</h1>
    <p class="sub">〜 フィルムに刻まれたふたりの軌跡 〜</p>
  </header>

  <!-- 🎞️ 画面いっぱいに広がる2段シネマフィルムリール -->
  <main class="film-viewport-double">
    <div class="film-track-row">
      <div class="film-track" id="filmTrackTop"></div>
    </div>
    <div class="film-track-row">
      <div class="film-track" id="filmTrackBottom"></div>
    </div>
  </main>

  <!-- 操作ヒントガイド -->
  <div class="cinema-guide">
    <p>👈 写真タップで裏メッセージが読めます 👉</p>
  </div>

  <!-- 3Dモーダル ＆ 裏返しフリップ -->
  <div class="photo-pop-modal" id="photoModal">
    <div class="pop-card-inner" id="popCardInner">
      
      <!-- 表面 -->
      <div class="pop-card-front-face">
        <div class="card-img-wrap">
          <img id="modalImg" src="" alt="写真">
          <div class="pop-timestamp" id="modalStamp">'26.07.03</div>
        </div>
        <div class="pop-card-info">
          <h3 id="modalTitle">Memory Title</h3>
          <div class="flip-hint-text">🔄 カードをタップすると裏面が読めます</div>
        </div>
        <div class="pop-btn-group">
          <button class="pop-btn flip-btn" id="flipToBackBtn" type="button">🔄 裏面を読む</button>
          <button class="pop-btn" id="modalCloseFront" type="button">CLOSE</button>
        </div>
      </div>

      <!-- 裏面 -->
      <div class="pop-card-back-face">
        <h3 id="modalBackTitle">Memory Title</h3>
        <p id="modalDesc">ここに結南さんからの手記が入ります。</p>
        <div class="pop-btn-group">
          <button class="pop-btn flip-btn" id="flipToFrontBtn" type="button">🔄 表に戻す</button>
          <button class="pop-btn" id="modalCloseBack" type="button">CLOSE</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    const cinemaMemories = [
      { src: 'images/prologue.png', date: "'26.07.03", title: "Prologue", desc: "すべての始まりの夜. 見えなくなるまで手を振ってくれた笑顔は一生の宝物." },
      { src: 'images/page01.png', date: "'26.07.03", title: "付き合った日", desc: "もんじゃ焼き食べて、カラオケで初キスして、公園で告白。緊張したなぁ." },
      { src: 'images/page02.png', date: "'26.07.05", title: "初めてダンスを見た日", desc: "ステージの上の姿が格好良すぎて感動。花束喜んでくれて嬉しかった" },
      { src: 'images/page03.png', date: "'26.07.07", title: "七夕の短冊", desc: "字も美しくて惚れ直しました。一生大切にします." },
      { src: 'images/page04.png', date: "'26.07.10", title: "初めてのお弁当", desc: "失敗した炊き込みご飯でも「おいしい」って食べてくれた優しさに感謝." },
      { src: 'images/page05.png', date: "'26.07.11", title: "すみだ水族館", desc: "青い光の中のみなみさんが綺麗すぎて…初めてのお泊りも最高だった." },
      { src: 'images/page06.png', date: "'26.07.12", title: "照れ顔お泊り", desc: "アイス食べて恥ずかしそうにする顔が可愛すぎてメロメロ！" },
      { src: 'images/page07.png', date: "'26.07.14", title: "映画館キス", desc: "トイ・ストーリー4見た。映画館でのキス写真、ずっとお気に入りだよ." },
      { src: 'images/page08.png', date: "'26.07.16", title: "ちょっぴりSなお泊り", desc: "忍耐力ゼロなふたりが愛おしい.初めてみなみさんのＳっ気に触れました" },
      { src: 'images/page09.png', date: "'26.07.18", title: "馬場飲み＆チンチロ", desc: "メガジョッキ引き当てるみなみさんいい加減にして？楽しい時間をありがとう." },
      { src: 'images/page10.png', date: "'26.07.19", title: "ダンス送迎＆スマホケース", desc: "サプライズ失敗したけど、嬉しそうな笑顔が見られて幸せです。お揃い増やしていこう" },
      { src: 'images/page11.png', date: "'26.07.23", title: "角煮＆サウナハット", desc: "角煮おいしすぎたね。サウナハットのサプライズ本当に嬉しかった.早く温泉行こう。" },
      { src: 'images/page12.png', date: "'26.07.26", title: "ゲーセン大はしゃぎ", desc: "太鼓の達人にマリカーのもぐらたたき。ゲーセンでもこんなに笑えて楽しいよ。" },
      { src: 'images/page13.png', date: "'26.07.28", title: "雨の花火大会", desc: "傘の中の二人だけの死角.『愛は勝つ』は永遠の思い出の曲。また見に行こうね" },
      { src: 'images/page14.png', date: "'26.08.09", title: "葛西臨海公園の夜", desc: "海辺でずーっとキスしてたら日暮れてたね。 ひまわりも綺麗だった。みなみさんはもっときれいだった。" },
      { src: 'images/page15.png', date: "'26.08.16", title: "ダンス公演", desc: "踊るみなみさんは世界一カッコいいです。何回見ても飽きないダンスでこれからも虜にしてください。" },
      { src: 'images/page16.png', date: "'26.08.22", title: "九十九里浜ドライブ", desc: "二人で全身びしょぬれになってお絵描きもして最高の海だったね。道中に食べたハンバーグおいしかった、見つけてくれてありがとう" },
      { src: 'images/page17.png', date: "'26.08.21", title: "5日間連続お泊り", desc: "こんなに長いこといても何一つ嫌な思いをしないのが本当にすごいなって感じます。ピアノもギターもがんばります。いつか協奏しよう。" },
      { src: 'images/page18.png', date: "'26.09.01", title: "ディズニーシー", desc: "幸せすぎたなぁ。トイマニ叫びすぎ笑 地球儀の前で膝抱えるポーズも最高だった！" },
      { src: 'images/extra11.png', date: "'26 MEMORIES", title: "Special Moment", desc: "ふたりの笑顔が弾けた最高に愛おしい一枚." },
      { src: 'images/extra12.png', date: "'26 MEMORIES", title: "Happy Time", desc: "いつでも隣で笑い合える幸せを感じた日." },
      { src: 'images/extra13.png', date: "'26 MEMORIES", title: "Sweet Memory", desc: "何気ない日常が、みなみさんといると特別な日になる." },
      { src: 'images/extra14.png', date: "'26 MEMORIES", title: "Precious Day", desc: "ずっと一緒にいたいと思えた愛おしい瞬間." },
      { src: 'images/extra15.png', date: "'26 MEMORIES", title: "Love Story", desc: "世界で一番大好きな人の一番近くにいられる奇跡." },
      { src: 'images/extra16.png', date: "'26 MEMORIES", title: "Forever & Always", desc: "これからもずっと、二人でたくさんの景色を見に行こうね." }
    ];

    function createFrame(item) {
      const frame = document.createElement('div');
      frame.className = 'film-frame';
      
      const img = document.createElement('img');
      img.src = item.src;
      img.alt = item.title;
      
      const stamp = document.createElement('div');
      stamp.className = 'frame-stamp';
      stamp.textContent = item.date;
      
      frame.appendChild(img);
      frame.appendChild(stamp);
      
      frame.addEventListener('click', (e) => {
        e.stopPropagation();
        openModal(item);
      });
      
      return frame;
    }

    function initFilmTracks() {
      const topEl = document.getElementById('filmTrackTop');
      const bottomEl = document.getElementById('filmTrackBottom');

      if (topEl && bottomEl) {
        const fullList = [...cinemaMemories, ...cinemaMemories, ...cinemaMemories];

        topEl.innerHTML = '';
        fullList.forEach(item => topEl.appendChild(createFrame(item)));

        bottomEl.innerHTML = '';
        [...fullList].reverse().forEach(item => bottomEl.appendChild(createFrame(item)));
      }
    }

    // ♾️ 永遠ループアニメーション
    let topX = 0;
    let bottomX = -1500;

    function animateFilm() {
      topX -= 0.8;
      if (topX < -3000) topX = 0;
      
      const topEl = document.getElementById('filmTrackTop');
      if (topEl) topEl.style.transform = `translateX(${topX}px)`;

      bottomX += 0.8;
      if (bottomX > 0) bottomX = -3000;
      
      const bottomEl = document.getElementById('filmTrackBottom');
      if (bottomEl) bottomEl.style.transform = `translateX(${bottomX}px)`;

      requestAnimationFrame(animateFilm);
    }

    // モーダル ＆ フリップ処理
    function openModal(item) {
      const modal = document.getElementById('photoModal');
      const inner = document.getElementById('popCardInner');
      
      if (modal) {
        document.getElementById('modalImg').src = item.src;
        document.getElementById('modalStamp').textContent = item.date;
        document.getElementById('modalTitle').textContent = item.title;
        document.getElementById('modalBackTitle').textContent = item.title;
        document.getElementById('modalDesc').textContent = item.desc;
        
        if (inner) inner.classList.remove('is-flipped');
        modal.classList.add('show');
      }
    }

    function toggleFlip(e) {
      if (e) e.stopPropagation();
      const inner = document.getElementById('popCardInner');
      if (inner) inner.classList.toggle('is-flipped');
    }

    function setupEvents() {
      const flipToBackBtn = document.getElementById('flipToBackBtn');
      const flipToFrontBtn = document.getElementById('flipToFrontBtn');
      const modalCloseFront = document.getElementById('modalCloseFront');
      const modalCloseBack = document.getElementById('modalCloseBack');
      const modal = document.getElementById('photoModal');
      const inner = document.getElementById('popCardInner');

      if (flipToBackBtn) flipToBackBtn.onclick = toggleFlip;
      if (flipToFrontBtn) flipToFrontBtn.onclick = toggleFlip;
      
      if (inner) {
        inner.onclick = (e) => {
          if (e.target.tagName !== 'BUTTON') toggleFlip(e);
        };
      }

      const closeModal = () => { if (modal) modal.classList.remove('show'); };
      if (modalCloseFront) modalCloseFront.onclick = closeModal;
      if (modalCloseBack) modalCloseBack.onclick = closeModal;
      if (modal) {
        modal.onclick = (e) => { if (e.target === modal) closeModal(); };
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initFilmTracks();
      setupEvents();
      animateFilm();
    });
  </script>
</body>
</html>
