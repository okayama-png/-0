<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CINEMA FILM — Minami & Yuna</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260919_final">
</head>
<body class="cinema-body">

  <div class="cinema-container">
    <header class="cinema-header">
      <div class="header-brand">MEMORIAL CINEMA</div>
      <h2>MEMORIES ON FILM</h2>
      <!-- 🌸 #album ハッシュをつけて直接本編ページへ戻るように修正 -->
      <a href="album_main.html#album" class="back-to-album-btn">📖 アルバム本編に戻る</a>
    </header>

    <main class="film-viewer">
      <div class="film-track-wrapper top-track">
        <div class="film-track" id="filmTrackTop"></div>
      </div>
      
      <div class="cinema-guide-text">
        <span>◀ フィルムを左右にスライドして好きな瞬間をタップ ▶</span>
      </div>

      <div class="film-track-wrapper bottom-track">
        <div class="film-track" id="filmTrackBottom"></div>
      </div>
    </main>
  </div>

  <div class="photo-modal-overlay" id="photoModal">
    <div class="pop-card-inner" id="popCardInner">
      <div class="pop-card-front">
        <button class="modal-close-btn" id="modalCloseFront">&times;</button>
        <div class="pop-photo-wrapper">
          <img id="modalImg" src="" alt="フィルム写真">
          <div class="pop-stamp" id="modalStamp"></div>
        </div>
        <div class="pop-caption-area">
          <h3 id="modalTitle"></h3>
          <button class="flip-hint-btn" id="flipToBackBtn">💬 想い出の言葉を読む (タップ)</button>
        </div>
      </div>

      <div class="pop-card-back">
        <button class="modal-close-btn" id="modalCloseBack">&times;</button>
        <div class="pop-back-content">
          <span class="back-tag">CINEMA CAPTION</span>
          <h3 id="modalBackTitle"></h3>
          <p id="modalDesc"></p>
          <button class="flip-hint-btn" id="flipToFrontBtn">🖼️ 写真に戻る</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const albumData = [
      { id: "000", cinemaDate: "'26.07.03", title: "000 - Prologue", cinemaDesc: "あの日、偶然入ったあのバーでみなみさんと出会えたこと。もしどちらかが少しでも違う選択をしていたらと思うと、奇跡としか思えない夜でした。見えなくなるまで改札でずっと手を振り続けてくれたあの笑顔は、今も私の胸の中でずっと輝いています。ずっとずっとみなみさんが笑顔でいてくれることを祈ってます。", image: "images/prologue.png" },
      { id: "001", cinemaDate: "'26.07.03", title: "001 - 付き合った日", cinemaDesc: "仕事終わりにお迎えに行って食べたもんじゃ焼き。張り切って焼いてくれた姿が可愛くて、それだけで幸せだった。その後のカラオケでまだ付き合ってもないのにしちゃった、心臓が破裂しそうな初キス。公園で声を震わせながらした告白。緊張しすぎててぎこちなかったと思うけど、受け入れてくれてありがとう。幸せになろうね。", image: "images/page01.png" },
      { id: "002", cinemaDate: "'26.07.05", title: "002 - 初めてダンスを見た日", cinemaDesc: "ステージの上で踊るみなみさんは、息をのむほど格好良くて圧倒されっぱなしだった。終演後に花束を渡した時の無邪気な笑顔も、そのあと公園でスムージーを飲みながら過ごしたやわらかな時間も全部宝物。大好きな人の一番近くで輝きを見つめられる幸せを噛みしめてました。", image: "images/page02.png" },
      { id: "003", cinemaDate: "'26.07.07", title: "003 - 七夕", cinemaDesc: "七夕の夜に送り合った短冊。「ずっと隣で笑い合えますように」と願いを込めたけれど、みなみさんが書いてくれた美しい字と直筆の「大好き」の文字を見た瞬間、胸がぎゅっとなるくらい惚れ直してしまった。どんな壁があってもこの人となら乗り越えていける、そう強く確信したよ。", image: "images/page03.png" },
      { id: "004", cinemaDate: "'26.07.10", title: "004 - 初めてのお弁当", cinemaDesc: "寝ぼけて炊き込みご飯の水の量を間違えちゃったけれど、「味はすごく美味しいよ」って優しく微笑んで食べてくれたその温もりが嬉しかった。いつか同じ家でお弁当を作ってそれを渡して「いってらっしゃい」と言いたいなと思い描いた日。", image: "images/page04.png" },
      { id: "005", cinemaDate: "'26.07.11", title: "005 - 水族館と初お泊り", cinemaDesc: "一日中ダンスで疲れているはずなのに、嫌な顔ひとつせずお迎えに来てくれた深すぎる優しさ。すみだ水族館の青く静かな光の中に浮かび上がるみなみさんは、まるで女神みたいに綺麗だった。そして初めてのお泊り。あまりにも幸せだったね。", image: "images/page05.png" },
      { id: "006", cinemaDate: "'26.07.12", title: "006 - お泊り", cinemaDesc: "「会いたい」という私のわがままを優しく受け止めてくれて実現した、みなみさん家でのお泊り。カメラを向けると照れてそっぽを向いちゃったり、アイスを食べながら目が合うだけで恥ずかしそうに笑う顔が愛おしすぎてメロメロ。少しずつ縮まっていくふたりの距離がたまらなく愛おしい。", image: "images/page06.png" },
      { id: "007", cinemaDate: "'26.07.14", title: "007 - 映画とお泊り", cinemaDesc: "『トイ・ストーリー4』を見に行った日。映画館の一番後ろの席を取ろうとしてチケットを1枚しか取っていなかった私の大ポカも笑い飛ばしてくれてありがとう。映画館の暗闇の中で重ねたキス写真はずっと私のお気に入り。翌朝作ってくれたお弁当の美味しさと優しさに、胸がいっぱいになりました。ありがとう。", image: "images/page07.png" },
      { id: "008", cinemaDate: "'26.07.16", title: "008 - お泊り", cinemaDesc: "「明日お弁当持っていきたい」と言ったら、まさかのみなみさんからお泊りの誘い！お互いに「今日は疲れたから即寝る」って意気込んでいたはずなのに、気づいたら始まっちゃうふたり。双方そろって忍耐力ゼロなところも愛おしい。ちょっぴりSっ気満載なみなみさんに、今日もメロメロです。", image: "images/page08.png" },
      { id: "009", cinemaDate: "'26.07.18", title: "009 - 飲みとお泊り", cinemaDesc: "馬場飲みからのみなみさん家にお泊り。「チンチロしたい！」って大はしゃぎして案の定メガジョッキを引き当てるお茶目な姿に爆笑。結局半分くらい私が飲んでた気もするけどね笑飾らないありのままのみなみさんと過ごす時間は、私にとって世界で一番心地いい居場所です。", image: "images/page09.png" },
      { id: "010", cinemaDate: "'26.07.19", title: "010 - ダンスの送迎", cinemaDesc: "ダンス公演に行けない寂しさを埋めたくて、埼玉会館まで送迎した日。内緒でお揃いのスマホケースを買おうとコソコソいじっていたら怪しまれて、焦って自爆したサプライズ大失敗。でも、あんなに嬉しそうな笑顔が見られたから大成功ってことでいいよね。みなみさんと出会えた奇跡に感謝する毎日です。", image: "images/page10.png" },
      { id: "011", cinemaDate: "'26.07.23", title: "011 - お泊り", cinemaDesc: "仕事終わりに直行して一緒に作った豚の角煮。私の帰りを待ちながら作ってくれてた姿を想像するとたまらないです。ご飯も炊きたてを食べさせようとしてくれてて愛感じたよ。全部とってもおいしかったよありがとう。「プレゼントがあります！」ってにっこにこ顔で渡された袋を開けると、サウナハット。私のポロッと言った言葉を覚えていてくれたその優しさに、心から愛が溢れました。", image: "images/page11.png" },
      { id: "012", cinemaDate: "'26.07.26", title: "012 - お泊まり", cinemaDesc: "馬場でお寿司を食べてゲーセンで太鼓の達人にマリカー、モグラ叩きまで本気で大はしゃぎ。お泊りした翌朝のキスマ攻防戦も、じゃれ合いすぎて出かけるギリギリになっちゃうのもふたりのお約束。「会えない時間や距離に僕らは試されている」——離れている時間さえも愛を深めてくれる大切な存在です。", image: "images/page12.png" },
      { id: "013", cinemaDate: "'26.07.28", title: "013 - 花火大会", cinemaDesc: "告白する予定だった日に、恋人同士として見れた花火大会。夜空を見上げる横顔が咲き誇るどの花火よりも綺麗で、途中の小雨のおかげで傘という二人だけの小さな死角のなかで重ねた唇。BGMで流れていた『愛は勝つ』は、一生忘れられないふたりだけの特別なテーマソング。来年もこの先もずっと隣で見ようね。来年はどこに見に行こうか。", image: "images/page13.png" },
      { id: "014", cinemaDate: "'26.08.09", title: "014 - 葛西臨海公園", cinemaDesc: "ダンス送迎のあとに向かった夜の葛西臨海公園。美味しいものを頬張ったあと、海辺へ移動してふたりでずーーっとキス。空が深い闇に包まれるまで時間を忘れて重ね合った唇。夜のひまわりのライトアップに照らされたみなみさんは、今日も飛び切りの綺麗さで私の心を奪っていきました。", image: "images/page14.png" },
      { id: "015", cinemaDate: "'26.08.16", title: "015 - ダンス公演", cinemaDesc: "ダンス公演で見せる圧巻のパフォーマンス。ステージの上で踊る姿は一瞬で目を奪われるほど格好良くて、何回見ても胸が熱くなる。たくさん練習して努力してるんだろうなと思わされるほど、伝わってくる圧倒的な表現力。これからもたくさんの公演を見に行けたら嬉しいです。", image: "images/page15.png" },
      { id: "016", cinemaDate: "'26.08.22", title: "016 - 九十九里浜ドライブ", cinemaDesc: "九十九里浜広かったな。到着してすぐに海へ飛び込んで、ずぶ濡れになりながら笑い合った青春みたいな一日。美味しいハンバーグを食べて、夜は韓国料理屋さんで夢中になってゲームを語る無邪気な姿が愛おしかった。時間がいくらあっても足りないくらい楽しい日々をありがとう。", image: "images/page16.png" },
      { id: "017", cinemaDate: "'26.08.21", title: "017 - 5日間のお泊り", cinemaDesc: "気づけばなんと5日連続のお泊り。お洗濯をしてお料理を作って、大好きな人の帰りをワクワクしながら待つ時間は言葉にできないほど幸せだった。同棲への夢がもっと膨らんだ日々。練習したピアノも優しく褒めてくれてありがとう。ギターも頑張るから、いつか絶対にふたりで合奏しようね。", image: "images/page17.png" },
      { id: "018", cinemaDate: "'26.09.01", title: "018 - ディズニーシー", cinemaDesc: "ふたりで初めて行った夢のディズニーシー。アトラクションで叫びすぎて喉がやられたのも、ポップコーンを6個も食べて帰りにお腹すいたって言うみなみさんも最高に愛おしいです。地球儀の前で膝を抱えて撮った写真も宝物。みなみさんといると何気ない瞬間もすべてが幸せに変わるよ。ずっと愛しています。", image: "images/page18.png" }
    ];

    function createFrame(item) {
      const frame = document.createElement('div');
      frame.className = 'film-frame';
      
      const img = document.createElement('img');
      img.src = item.image; img.alt = item.title;
      
      const title = document.createElement('div');
      title.className = 'frame-title'; title.textContent = item.title;

      const stamp = document.createElement('div');
      stamp.className = 'frame-stamp'; stamp.textContent = item.cinemaDate;
      
      frame.appendChild(img); frame.appendChild(title); frame.appendChild(stamp);
      
      frame.addEventListener('click', (e) => { e.stopPropagation(); openModal(item); });
      return frame;
    }

    function initFilmTracks() {
      const topEl = document.getElementById('filmTrackTop');
      const bottomEl = document.getElementById('filmTrackBottom');

      if (topEl && bottomEl) {
        const multiList = [...albumData, ...albumData, ...albumData, ...albumData];
        topEl.innerHTML = ''; multiList.forEach(item => topEl.appendChild(createFrame(item)));
        bottomEl.innerHTML = ''; [...multiList].reverse().forEach(item => bottomEl.appendChild(createFrame(item)));
      }
    }

    let topX = -2000, bottomX = -2000;
    let baseSpeedTop = -0.6, baseSpeedBottom = 0.6;
    let velocityTop = 0, velocityBottom = 0;
    let isDragging = false, dragTarget = null, lastClientX = 0, lastTime = 0;
    const LOOP_WIDTH = 4180;

    function animateFilm() {
      if (!isDragging) {
        velocityTop *= 0.94; velocityBottom *= 0.94;
        topX += baseSpeedTop + velocityTop; bottomX += baseSpeedBottom + velocityBottom;
      }

      while (topX < -LOOP_WIDTH * 2) topX += LOOP_WIDTH;
      while (topX > -LOOP_WIDTH) topX -= LOOP_WIDTH;
      while (bottomX > -LOOP_WIDTH) bottomX -= LOOP_WIDTH;
      while (bottomX < -LOOP_WIDTH * 2) bottomX += LOOP_WIDTH;

      const topEl = document.getElementById('filmTrackTop');
      if (topEl) topEl.style.transform = `translate3d(${topX}px, 0, 0)`;
      
      const bottomEl = document.getElementById('filmTrackBottom');
      if (bottomEl) bottomEl.style.transform = `translate3d(${bottomX}px, 0, 0)`;

      requestAnimationFrame(animateFilm);
    }

    function setupDragEvents() {
      const topTrack = document.getElementById('filmTrackTop');
      const bottomTrack = document.getElementById('filmTrackBottom');

      const handleStart = (clientX, target) => {
        isDragging = true; dragTarget = target; lastClientX = clientX; lastTime = performance.now();
        if (target === 'top') velocityTop = 0; if (target === 'bottom') velocityBottom = 0;
      };

      const handleMove = (clientX) => {
        if (!isDragging) return;
        const now = performance.now(); const dt = Math.max(1, now - lastTime); const diffX = clientX - lastClientX;
        if (dragTarget === 'top') { topX += diffX; velocityTop = (diffX / dt) * 14; }
        else if (dragTarget === 'bottom') { bottomX += diffX; velocityBottom = (diffX / dt) * 14; }
        lastClientX = clientX; lastTime = now;
      };

      const handleEnd = () => { isDragging = false; dragTarget = null; };

      if (topTrack) {
        topTrack.addEventListener('mousedown', (e) => handleStart(e.clientX, 'top'));
        topTrack.addEventListener('touchstart', (e) => handleStart(e.touches[0].clientX, 'top'), { passive: true });
      }

      if (bottomTrack) {
        bottomTrack.addEventListener('mousedown', (e) => handleStart(e.clientX, 'bottom'));
        bottomTrack.addEventListener('touchstart', (e) => handleStart(e.touches[0].clientX, 'bottom'), { passive: true });
      }

      window.addEventListener('mousemove', (e) => handleMove(e.clientX));
      window.addEventListener('mouseup', handleEnd);
      window.addEventListener('touchmove', (e) => { if (e.touches && e.touches[0]) handleMove(e.touches[0].clientX); }, { passive: true });
      window.addEventListener('touchend', handleEnd);
    }

    function openModal(item) {
      const modal = document.getElementById('photoModal');
      const inner = document.getElementById('popCardInner');
      if (modal) {
        document.getElementById('modalImg').src = item.image;
        document.getElementById('modalStamp').textContent = item.cinemaDate;
        document.getElementById('modalTitle').textContent = item.title;
        document.getElementById('modalBackTitle').textContent = item.title;
        document.getElementById('modalDesc').textContent = item.cinemaDesc;
        if (inner) inner.classList.remove('is-flipped');
        modal.classList.add('show');
      }
    }

    function toggleFlip(e) { if (e) e.stopPropagation(); const inner = document.getElementById('popCardInner'); if (inner) inner.classList.toggle('is-flipped'); }

    function setupEvents() {
      const flipToBackBtn = document.getElementById('flipToBackBtn');
      const flipToFrontBtn = document.getElementById('flipToFrontBtn');
      const modalCloseFront = document.getElementById('modalCloseFront');
      const modalCloseBack = document.getElementById('modalCloseBack');
      const modal = document.getElementById('photoModal');

      if (flipToBackBtn) flipToBackBtn.onclick = toggleFlip;
      if (flipToFrontBtn) flipToFrontBtn.onclick = toggleFlip;

      const closeModal = () => { if (modal) modal.classList.remove('show'); };
      if (modalCloseFront) modalCloseFront.onclick = closeModal;
      if (modalCloseBack) modalCloseBack.onclick = closeModal;
      if (modal) modal.onclick = (e) => { if (e.target === modal) closeModal(); };
    }

    window.addEventListener('DOMContentLoaded', () => {
      initFilmTracks(); setupEvents(); setupDragEvents(); animateFilm();
    });
  </script>
</body>
</html>
