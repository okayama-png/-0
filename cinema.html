<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Minami & Yuna — Cinema Film Flow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="cinema.css">
</head>
<body>

  <!-- 背景シネマキャンバス -->
  <div class="cinema-bg"></div>

  <!-- タイトルヘッダー -->
  <header class="cinema-header">
    <div class="brand">CINEMATIC ARCHIVE</div>
    <h1>Minami & Yuna</h1>
    <p class="sub">〜 フィルムに刻まれたふたりの軌跡 〜</p>
  </header>

  <!-- 🎞️ 画面全体に広がる2段シネマフィルムリール -->
  <main class="film-viewport-double">
    <div class="film-track-row">
      <div class="film-track" id="filmTrackTop"></div>
    </div>
    <div class="film-track-row">
      <div class="film-track" id="filmTrackBottom"></div>
    </div>
  </main>

  <!-- 操作ヒントガイド -->
  <div class="cinema-guide">
    <p>👈 写真タップで裏メッセージが読めます 👉</p>
  </div>

  <!-- 3Dモーダル ＆ 裏返しフリップ -->
  <div class="photo-pop-modal" id="photoModal">
    <div class="pop-card-inner" id="popCardInner">
      
      <!-- 表面 -->
      <div class="pop-card-front-face">
        <div class="card-img-wrap">
          <img id="modalImg" src="" alt="写真">
          <div class="pop-timestamp" id="modalStamp">'26.07.03</div>
        </div>
        <div class="pop-card-info">
          <h3 id="modalTitle">Memory Title</h3>
          <div class="flip-hint-text">🔄 カードをタップすると裏面が読めます</div>
        </div>
        <div class="pop-btn-group">
          <button class="pop-btn flip-btn" id="flipToBackBtn" type="button">🔄 裏面を読む</button>
          <button class="pop-btn" id="modalCloseFront" type="button">CLOSE</button>
        </div>
      </div>

      <!-- 裏面 -->
      <div class="pop-card-back-face">
        <h3 id="modalBackTitle">Memory Title</h3>
        <p id="modalDesc">ここに結南さんからの手記が入ります。</p>
        <div class="pop-btn-group">
          <button class="pop-btn flip-btn" id="flipToFrontBtn" type="button">🔄 表に戻す</button>
          <button class="pop-btn" id="modalCloseBack" type="button">CLOSE</button>
        </div>
      </div>

    </div>
  </div>

  <script src="cinema.js"></script>
</body>
</html>
